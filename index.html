<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>
 
<body>
 <div class="bg-flowers"></div>
  <h1 class="title">Выбери свой продукт</h1>
   <button id="edit-first-card-color">Сменить цвет карточки</button>
    <button id="edit-all-cards-color">Изменить все карточки</button>
    <button id="open-google">Открыть страницу гугла</button>
    <button id="output-console-log">Вывести сообщение в консоль лог</button>
    <button id="color-toggle-button">Измени цвет кнопки</button>
  <ul id="product-catalog"></ul>
  <template id="product-template">
    <li class="card-container ">
      <img class="product-img" alt="img" height="245" width="290">
        <span class="product-category"></span>
        <h3 class="product-name"></h3>
        <p class="product-description"></p>
        <span class="product-compound-text">Состав:</span>
        <ul class="product-compound"></ul>
        <div class="product-price-container">
          <span class="product-price-text">Цена</span>
          <span class="product-price"></span>
        </div>
    </li>
  </template>  
<script src="homework-5.js"></script>
<script src="homewrk-6.js"></script>
<script src="homework-7.js" type="module"></script>
<script src="homework-8.js" type="module"></script>
</body>
</html>
